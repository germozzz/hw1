<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>霓虹打磚塊</title>
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 20px;
            color: #fff;
            font-family: Arial, "Noto Sans TC", sans-serif;
            background:
                radial-gradient(ellipse at top, #39206b 0%, #161034 42%, #09091b 100%);
        }

        .game {
            width: min(100%, 520px);
            text-align: center;
        }

        h1 {
            margin: 0 0 14px;
            color: #fff;
            font-size: clamp(26px, 7vw, 38px);
            letter-spacing: 3px;
            text-shadow: 0 0 12px #ff39d6, 0 0 28px #772cff;
        }

        .hud {
            display: flex;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 10px;
            color: #e9e3ff;
            font-weight: bold;
        }

        .hud span {
            padding: 8px 12px;
            border: 1px solid #a879ff88;
            border-radius: 10px;
            background: #211744cc;
            box-shadow: 0 0 12px #8a45ff22;
        }

        .screen {
            position: relative;
            overflow: hidden;
            border: 2px solid #dc72ff;
            border-radius: 16px;
            background: #100d29;
            box-shadow: 0 0 24px #ba36ff77, inset 0 0 24px #372068;
        }

        canvas {
            display: block;
            width: 100%;
            height: auto;
            touch-action: none;
        }

        .overlay {
            position: absolute;
            inset: 0;
            display: grid;
            place-content: center;
            gap: 12px;
            padding: 24px;
            background: #100b25d9;
            backdrop-filter: blur(4px);
        }

        .overlay[hidden] { display: none; }

        .overlay h2 {
            margin: 0;
            color: #ff9aef;
            font-size: 34px;
            text-shadow: 0 0 16px #ff39d6;
        }

        .overlay p {
            max-width: 320px;
            margin: 0;
            color: #e5ddff;
            line-height: 1.7;
        }

        button {
            padding: 11px 20px;
            border: 0;
            border-radius: 999px;
            color: #200b35;
            background: linear-gradient(90deg, #ff77d8, #ffc857);
            box-shadow: 0 0 18px #ff6bd477;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.15s, filter 0.15s;
        }

        button:hover {
            transform: translateY(-2px);
            filter: brightness(1.12);
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 12px;
        }

        .buttons button {
            min-width: 125px;
            color: #f7eaff;
            background: #392564;
            border: 1px solid #b27aff;
            box-shadow: 0 0 12px #823fff44;
        }

        .buttons button:hover { background: #523586; }

        .help {
            margin: 12px 0 0;
            color: #c7b9e8;
            font-size: 14px;
            line-height: 1.7;
        }
    </style>
</head>
<body>
    <main class="game">
        <h1>✨ 霓虹打磚塊 ✨</h1>

        <div class="hud">
            <span id="score">分數：0</span>
            <span id="level">關卡：1</span>
            <span id="lives">生命：3</span>
        </div>

        <div class="screen">
            <canvas id="game" width="480" height="640"></canvas>
            <div class="overlay" id="overlay">
                <h2 id="messageTitle">準備好了嗎？</h2>
                <p id="messageText">擊碎所有彩色磚塊，別讓球掉下去！</p>
                <button id="startButton">開始遊戲</button>
            </div>
        </div>

        <div class="buttons">
            <button id="pauseButton">暫停（P）</button>
            <button id="soundButton">音效：開</button>
        </div>
        <p class="help">移動：← → 或 A、D　｜　也可用滑鼠／觸控移動擋板　｜　暫停：P</p>
    </main>

    <script>
        const canvas = document.getElementById("game");
        const ctx = canvas.getContext("2d");
        const scoreElement = document.getElementById("score");
        const levelElement = document.getElementById("level");
        const livesElement = document.getElementById("lives");
        const overlay = document.getElementById("overlay");
        const messageTitle = document.getElementById("messageTitle");
        const messageText = document.getElementById("messageText");
        const startButton = document.getElementById("startButton");
        const pauseButton = document.getElementById("pauseButton");
        const soundButton = document.getElementById("soundButton");

        const WIDTH = canvas.width;
        const HEIGHT = canvas.height;
        const keys = new Set();
        const brickColors = ["#ff4fa3", "#ff8c42", "#ffd447", "#7dff72", "#36e0ff", "#aa75ff"];

        let state = "ready";
        let score = 0;
        let lives = 3;
        let level = 1;
        let hasStarted = false;
        let soundEnabled = true;
        let audioContext;
        let paddle;
        let ball;
        let bricks = [];
        let particles = [];
        let stars = [];
        let lastTime = 0;

        function playTone(frequency, duration, type = "sine", volume = 0.04, endFrequency = frequency) {
            if (!soundEnabled || !audioContext) return;

            const oscillator = audioContext.createOscillator();
            const gain = audioContext.createGain();
            const now = audioContext.currentTime;

            oscillator.type = type;
            oscillator.frequency.setValueAtTime(frequency, now);
            oscillator.frequency.exponentialRampToValueAtTime(Math.max(1, endFrequency), now + duration);
            gain.gain.setValueAtTime(volume, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + duration);

            oscillator.connect(gain);
            gain.connect(audioContext.destination);
            oscillator.start(now);
            oscillator.stop(now + duration);
        }

        function unlockAudio() {
            const AudioContextClass = window.AudioContext || window.webkitAudioContext;
            if (!audioContext && AudioContextClass) audioContext = new AudioContextClass();
            if (audioContext?.state === "suspended") audioContext.resume();
        }

        function showOverlay(title, text, buttonText) {
            messageTitle.textContent = title;
            messageText.textContent = text;
            startButton.textContent = buttonText;
            overlay.hidden = false;
        }

        function makeStars() {
            stars = Array.from({ length: 65 }, () => ({
                x: Math.random() * WIDTH,
                y: Math.random() * HEIGHT,
                size: Math.random() * 2 + 0.5,
                speed: 8 + Math.random() * 18
            }));
        }

        function updateHud() {
            scoreElement.textContent = `分數：${score}`;
            levelElement.textContent = `關卡：${level}`;
            livesElement.textContent = `生命：${lives}`;
        }

        function createBricks() {
            bricks = [];
            const columns = 8;
            const rows = Math.min(5 + Math.floor((level - 1) / 2), 7);
            const gap = 7;
            const side = 22;
            const brickWidth = (WIDTH - side * 2 - gap * (columns - 1)) / columns;
            const brickHeight = 22;

            for (let row = 0; row < rows; row++) {
                for (let column = 0; column < columns; column++) {
                    bricks.push({
                        x: side + column * (brickWidth + gap),
                        y: 75 + row * (brickHeight + gap),
                        width: brickWidth,
                        height: brickHeight,
                        color: brickColors[row % brickColors.length],
                        glow: brickColors[row % brickColors.length]
                    });
                }
            }
        }

        function placeBallOnPaddle() {
            ball = {
                x: paddle.x + paddle.width / 2,
                y: paddle.y - 12,
                radius: 9,
                vx: 0,
                vy: 0,
                speed: 310 + (level - 1) * 22
            };
        }

        function resetGame() {
            unlockAudio();
            score = 0;
            lives = 3;
            level = 1;
            hasStarted = true;
            particles = [];
            paddle = { x: WIDTH / 2 - 52, y: HEIGHT - 52, width: 104, height: 14, speed: 430 };
            createBricks();
            placeBallOnPaddle();
            updateHud();
            launchBall();
        }

        function launchBall() {
            if (state === "paused") return;
            state = "playing";
            overlay.hidden = true;

            if (ball.vx === 0 && ball.vy === 0) {
                const angle = (Math.random() * 0.55 - 0.275);
                ball.vx = Math.sin(angle) * ball.speed;
                ball.vy = -Math.cos(angle) * ball.speed;
            }

            pauseButton.textContent = "暫停（P）";
            playTone(480, 0.18, "sine", 0.05, 820);
        }

        function togglePause() {
            if (state === "playing") {
                state = "paused";
                keys.clear();
                showOverlay("遊戲暫停", "準備好就繼續挑戰！", "繼續遊戲");
                pauseButton.textContent = "繼續（P）";
            } else if (state === "paused") {
                state = "playing";
                overlay.hidden = true;
                pauseButton.textContent = "暫停（P）";
            }
        }

        function addParticles(x, y, color, amount = 10) {
            for (let i = 0; i < amount; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = 50 + Math.random() * 180;
                particles.push({
                    x, y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    life: 0.35 + Math.random() * 0.4,
                    color
                });
            }
        }

        function loseLife() {
            lives--;
            updateHud();
            playTone(220, 0.35, "sawtooth", 0.07, 70);

            if (lives <= 0) {
                state = "over";
                showOverlay("遊戲結束！", `你的分數是 ${score} 分，再挑戰一次吧！`, "重新開始");
                pauseButton.textContent = "暫停（P）";
                return;
            }

            placeBallOnPaddle();
            state = "ready";
            showOverlay("再接再厲！", `還有 ${lives} 條生命，按下按鈕繼續。`, "繼續遊戲");
        }

        function movePaddleTo(x) {
            if (!paddle) return;
            paddle.x = Math.max(0, Math.min(WIDTH - paddle.width, x - paddle.width / 2));

            if (state === "ready" && ball) {
                ball.x = paddle.x + paddle.width / 2;
            }
        }

        function pointerX(event) {
            const rect = canvas.getBoundingClientRect();
            return (event.clientX - rect.left) * WIDTH / rect.width;
        }

        function update(delta) {
            for (const star of stars) {
                star.y += star.speed * delta;
                if (star.y > HEIGHT) {
                    star.y = 0;
                    star.x = Math.random() * WIDTH;
                }
            }

            for (const particle of particles) {
                particle.x += particle.vx * delta;
                particle.y += particle.vy * delta;
                particle.life -= delta;
            }
            particles = particles.filter(particle => particle.life > 0);

            if (state !== "playing") return;

            const direction =
                (keys.has("ArrowRight") || keys.has("d") ? 1 : 0) -
                (keys.has("ArrowLeft") || keys.has("a") ? 1 : 0);

            paddle.x = Math.max(
                0,
                Math.min(WIDTH - paddle.width, paddle.x + direction * paddle.speed * delta)
            );

            ball.x += ball.vx * delta;
            ball.y += ball.vy * delta;

            if (ball.x - ball.radius < 0) {
                ball.x = ball.radius;
                ball.vx = Math.abs(ball.vx);
                playTone(330, 0.05, "triangle", 0.018, 440);
            } else if (ball.x + ball.radius > WIDTH) {
                ball.x = WIDTH - ball.radius;
                ball.vx = -Math.abs(ball.vx);
                playTone(330, 0.05, "triangle", 0.018, 440);
            }

            if (ball.y - ball.radius < 0) {
                ball.y = ball.radius;
                ball.vy = Math.abs(ball.vy);
                playTone(330, 0.05, "triangle", 0.018, 440);
            }

            const hitsPaddle =
                ball.vy > 0 &&
                ball.y + ball.radius >= paddle.y &&
                ball.y - ball.radius <= paddle.y + paddle.height &&
                ball.x >= paddle.x &&
                ball.x <= paddle.x + paddle.width;

            if (hitsPaddle) {
                ball.y = paddle.y - ball.radius;
                const hitPosition = (ball.x - (paddle.x + paddle.width / 2)) / (paddle.width / 2);
                const angle = hitPosition * 1.05;
                const speed = Math.hypot(ball.vx, ball.vy);
                ball.vx = Math.sin(angle) * speed;
                ball.vy = -Math.cos(angle) * speed;
                playTone(420, 0.08, "sine", 0.035, 650);
            }

            for (const brick of bricks) {
                if (brick.remove) continue;

                const nearestX = Math.max(brick.x, Math.min(ball.x, brick.x + brick.width));
                const nearestY = Math.max(brick.y, Math.min(ball.y, brick.y + brick.height));
                const dx = ball.x - nearestX;
                const dy = ball.y - nearestY;

                if (dx * dx + dy * dy <= ball.radius * ball.radius) {
                    brick.remove = true;
                    score += 10;
                    updateHud();
                    addParticles(ball.x, ball.y, brick.color, 12);
                    playTone(260 + Math.random() * 300, 0.12, "triangle", 0.045, 720);

                    if (Math.abs(dx) > Math.abs(dy)) ball.vx *= -1;
                    else ball.vy *= -1;
                    break;
                }
            }

            bricks = bricks.filter(brick => !brick.remove);

            if (bricks.length === 0) {
                level++;
                createBricks();
                ball.speed += 35;
                const speed = Math.hypot(ball.vx, ball.vy);
                ball.vx = ball.vx / speed * ball.speed;
                ball.vy = ball.vy / speed * ball.speed;
                updateHud();
                playTone(520, 0.3, "sine", 0.06, 1040);
            }

            if (ball.y - ball.radius > HEIGHT) loseLife();
        }

        function drawBackground() {
            const gradient = ctx.createLinearGradient(0, 0, 0, HEIGHT);
            gradient.addColorStop(0, "#171139");
            gradient.addColorStop(1, "#09091c");
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, WIDTH, HEIGHT);

            for (const star of stars) {
                ctx.globalAlpha = 0.35 + star.size / 4;
                ctx.fillStyle = "#fff";
                ctx.fillRect(star.x, star.y, star.size, star.size);
            }
            ctx.globalAlpha = 1;
        }

        function draw() {
            drawBackground();

            for (const brick of bricks) {
                ctx.save();
                ctx.shadowColor = brick.glow;
                ctx.shadowBlur = 14;
                ctx.fillStyle = brick.color;
                ctx.beginPath();
                ctx.roundRect(brick.x, brick.y, brick.width, brick.height, 6);
                ctx.fill();
                ctx.restore();

                ctx.fillStyle = "#ffffff66";
                ctx.fillRect(brick.x + 5, brick.y + 4, brick.width - 10, 3);
            }

            if (paddle) {
                const paddleGradient = ctx.createLinearGradient(paddle.x, 0, paddle.x + paddle.width, 0);
                paddleGradient.addColorStop(0, "#36e0ff");
                paddleGradient.addColorStop(0.5, "#bd6dff");
                paddleGradient.addColorStop(1, "#ff5aca");

                ctx.save();
                ctx.shadowColor = "#be5cff";
                ctx.shadowBlur = 18;
                ctx.fillStyle = paddleGradient;
                ctx.beginPath();
                ctx.roundRect(paddle.x, paddle.y, paddle.width, paddle.height, 8);
                ctx.fill();
                ctx.restore();
            }

            if (ball) {
                ctx.save();
                ctx.shadowColor = "#fff176";
                ctx.shadowBlur = 20;
                const ballGradient = ctx.createRadialGradient(
                    ball.x - 3, ball.y - 4, 1, ball.x, ball.y, ball.radius
                );
                ballGradient.addColorStop(0, "#fff");
                ballGradient.addColorStop(1, "#ffe35b");
                ctx.fillStyle = ballGradient;
                ctx.beginPath();
                ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }

            for (const particle of particles) {
                ctx.globalAlpha = Math.max(0, particle.life * 2);
                ctx.fillStyle = particle.color;
                ctx.fillRect(particle.x, particle.y, 4, 4);
            }
            ctx.globalAlpha = 1;
        }

        function loop(time = 0) {
            const delta = Math.min((time - lastTime) / 1000, 0.04);
            lastTime = time;
            update(delta);
            draw();
            requestAnimationFrame(loop);
        }

        startButton.addEventListener("click", () => {
            unlockAudio();

            if (state === "paused") {
                togglePause();
            } else if (state === "ready" && hasStarted) {
                launchBall();
            } else {
                resetGame();
            }
        });

        pauseButton.addEventListener("click", togglePause);

        soundButton.addEventListener("click", () => {
            soundEnabled = !soundEnabled;
            soundButton.textContent = `音效：${soundEnabled ? "開" : "關"}`;
            if (soundEnabled) {
                unlockAudio();
                playTone(600, 0.1);
            }
        });

        canvas.addEventListener("pointermove", event => movePaddleTo(pointerX(event)));
        canvas.addEventListener("pointerdown", event => {
            movePaddleTo(pointerX(event));
            if (state === "ready" && hasStarted) launchBall();
        });

        document.addEventListener("keydown", event => {
            const key = event.key.length === 1 ? event.key.toLowerCase() : event.key;

            if (["ArrowLeft", "ArrowRight", " "].includes(event.key)) event.preventDefault();
            keys.add(key);

            if (key === "p" && !event.repeat) togglePause();
        });

        document.addEventListener("keyup", event => {
            const key = event.key.length === 1 ? event.key.toLowerCase() : event.key;
            keys.delete(key);
        });

        window.addEventListener("blur", () => keys.clear());

        paddle = { x: WIDTH / 2 - 52, y: HEIGHT - 52, width: 104, height: 14, speed: 430 };
        placeBallOnPaddle();
        makeStars();
        createBricks();
        updateHud();
        requestAnimationFrame(loop);
    </script>
</body>
</html>
